{% extends 'base.html' %}
{% block header%}
    <title>admin products</title>
{% endblock%}


{% block body %}
    <table style="border: 1px solid black;">
        <tr>
            <th>name:</th>
            <th>description:</th>
            <th>price</th>
            <th>active</th>
            <th>edit</th>
        </tr>
    {% for p in products%}
    <tr>
        <td>  {{  p.name  }}  </td>
        <td>  {{  p.description  }}  </td>
        <td>  {{  p.price  }}  </td>
        <td>  {{  "yes" if p.active == 1 else 'no' }}  </td>
        <td><a href="/admin/dashboard/edit-product/{{ p.id }}">edit</a></td>
    {% endfor %}
    </table>



    <form action="#" METHOD="post">
        <input type="text" name="name" placeholder="name mobile"><br>
        <textarea name="description" placeholder="Explanations"></textarea><br>
        <input type="number" name="price" placeholder="price mobile"><br>
        <label>ON:</label><input type="checkbox" name="active"><br>
        <input type="submit">
        
    </form>
{% endblock %}
